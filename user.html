<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="user.css">
</head>
<body>
    <!-- Header Section -->
    <div class="header">
        <img src="copbot-logo.png" alt="CopBot Logo" class="logo">
        <h1></h1>
    </div>

    <!-- Language Selection Section -->
    <div id="language-selection">
        <h2>Select Your Language</h2>
        <div class="language-options">
            <button class="language-btn" value="english">English</button>
            <button class="language-btn" value="tamil">தமிழ்</button>
            <button class="language-btn" value="hindi">हिन्दी</button>
            <button class="language-btn" value="telugu">తెలుగు</button>
        </div>
        <button id="confirm-language">Confirm</button>
    </div>

    <script src="user.js"></script>
</body>
</html>
