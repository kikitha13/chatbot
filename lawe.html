<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Penal Code (IPC) Laws</title>
    <link rel="stylesheet" href="lawe.css">
</head>
<body>
    <div class="container">
        <h2>Indian Penal Code (IPC) - Crime & Punishment</h2>

        <label for="crimeType">Select Crime Type:</label>
        <select id="crimeType">
            <option value="">-- Select Crime --</option>
            <option value="murder">Murder</option>
            <option value="theft">Theft</option>
            <option value="cybercrime">Cybercrime</option>
            <option value="assault">Assault</option>
            <option value="fraud">Fraud</option>
        </select>

        <input type="text" id="searchLaw" placeholder="Search IPC Section...">

        <div id="ipcResult">
            <h3>IPC Section & Punishment Details</h3>
            <p id="lawDetails">Select a crime to view details.</p>
        </div>

        <div class="links">
            <a href="firenglish.html">File FIR</a>
            <a href="baile.html">Apply for Bail</a>
        </div>
    </div>

    <script src="lawe.js"></script>
</body>
</html>
