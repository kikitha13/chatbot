<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIR Filing System</title>
    <link rel="stylesheet" href="fir.css">
</head>
<body>
    <div class="container">
        <h2>FIR Filing System</h2>
        <form id="firForm">
            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="Enter your full name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" placeholder="Enter your phone number" required>
            
            <label for="address">Address:</label>
            <input type="text" id="address" placeholder="Enter your address" required>
            
            <label for="crimeType">Crime Type:</label>
            <select id="crimeType" required>
                <option value="">Select Crime Type</option>
                <option value="Theft">Theft</option>
                <option value="Assault">Assault</option>
                <option value="Fraud">Fraud</option>
            </select>
            
            <label for="details">Details:</label>
            <textarea id="details" placeholder="Enter crime details" required></textarea>
            
            <label for="datetime">Incident Date & Time:</label>
            <input type="datetime-local" id="datetime" required>
            
            <label for="file">Upload Evidence (Optional):</label>
            <input type="file" id="file">
            
            <button type="submit">Submit FIR</button>
        </form>
    </div>
    <script src="fir.js"></script>
</body>
</html>
